server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Roteamento SPA — redireciona tudo para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache longo para assets com hash no nome (gerados pelo Angular)
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sem cache para index.html (sempre busca a versão mais nova)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
